services:
  backend:
    build:
      context: ../.
      dockerfile: ./backend/Dockerfile 
      target: development
    restart: unless-stopped
    env_file: ".env"
    environment:
      DISPLAY: ${DISPLAY_TO_USE:?}
    ports:
      - ${API_PORT}:3000
    volumes:
      - /app/node_modules
      - ../backend/src:/app/backend/src:rw
      - ../backend/cache:/app/backend/cache:rw
      - ../shared:/app/shared:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/tmp/host.Xauthority:ro
    privileged: true
    pid: "host"              # Share host's PID namespace
    ipc: "host"              # Share host's IPC namespace (optional, for shared memory)
    cap_add:
      - SYS_PTRACE           # Allow ptrace system call
      - SYS_ADMIN            # May be needed for some memory operations
    security_opt:
      - apparmor:unconfined  # Disable AppArmor restrictions

  frontend:
    build:
      context: ../.
      dockerfile: ./frontend/Dockerfile 
      target: development
    restart: unless-stopped
    env_file: ".env"
    volumes:
      - /app/node_modules
      - ../frontend/src:/app/frontend/src:rw
      - ../shared:/app/shared:rw
      - ../backend:/app/backend:rw
    ports:
      - "${DASHBOARD_FRONTEND_PORT}:9000"
    depends_on:
      - backend
